name: Deploy en GitHub Pages

on:
  workflow_dispatch:

# Permisos necesarios para publicar en Pages y obtener token OIDC
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular (production)
        working-directory: ./frontend
        run: |
          npm run build -- --base-href /daw2-Proyecto-Cohabit/
      - name: Copy index.html to 404.html for GH Pages fallback
        working-directory: ./frontend
        run: |
          cp dist/frontend/browser/index.html dist/frontend/browser/404.html || true
      - name: Deploy to gh-pages (push)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist/frontend/browser
          publish_branch: gh-pages
          nojekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
