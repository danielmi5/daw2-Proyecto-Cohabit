<header class="cabecera">
  <app-tooltip texto="Ir a Inicio">
    <a routerLink="/" class="cabecera__logo">
      <picture class="cabecera__logo-icono">
        <img src="header/logo.svg" alt="Cohabit" class="cabecera__logo-icono">
      </picture>
    </a>
  </app-tooltip>

  <nav class="cabecera__nav" role="navigation" aria-label="Menú principal" [class.cabecera__nav--open]="menuAbierto" [class.cabecera__nav--hidden]="!menuAbierto">
    <ul class="cabecera__menu">
      <li class="cabecera__menu-opcion">
        <a routerLink="/inicio" class="cabecera__menu-enlace" (click)="menuAbierto = false">INICIO</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/dashboard" class="cabecera__menu-enlace" (click)="menuAbierto = false">DASHBOARD</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/style-guide" class="cabecera__menu-enlace" (click)="menuAbierto = false">STYLE GUIDE</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/grupo" class="cabecera__menu-enlace" (click)="menuAbierto = false">MI GRUPO</a>
      </li>
    </ul>
  </nav>
  
  <section class="cabecera__utilidades">
    <button 
      class="cabecera__boton cabecera__hamburguesa" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      aria-controls="main-navigation">
      <span class="cabecera__icono" [feather]="'menu'" [tipo]="'header'"></span>
    </button>
    <button class="cabecera__boton" aria-label="Cambiar tema" (click)="alternarTema()">
      <app-tooltip [texto]="modoTitle">
        <span class="cabecera__icono" [feather]="modoIcon" [tipo]="'header'"></span>
      </app-tooltip>
    </button>
    <a routerLink="/perfil" class="cabecera__boton" aria-label="Perfil de usuario">
      <app-tooltip texto="Perfil">
        <span class="cabecera__icono" [feather]="'user'" [tipo]="'header'" role="img" aria-label="Perfil"></span>
      </app-tooltip>
    </a>
  </section>
</header>
