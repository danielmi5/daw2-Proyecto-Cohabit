<header class="cabecera">
  <a routerLink="/" class="cabecera__logo">
    <picture class="cabecera__logo-icono">
      <img src="" alt="Cohabit" class="cabecera__logo-icono">
    </picture>
  </a>

  
  <nav class="cabecera__navegacion">
    <ul class="cabecera__menu">
      <li class="cabecera__menu-opcion">
        <a routerLink="/inicio" class="cabecera__menu-enlace">INICIO</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/dashboard" class="cabecera__menu-enlace">DASHBOARD</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/componentes" class="cabecera__menu-enlace">COMPONENTES</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/dashboard" class="cabecera__menu-enlace">MI GRUPO</a>
      </li>
    </ul>
  </nav>
  
  <section class="cabecera__utilidades">
    <button class="cabecera__boton" aria-label="Cambiar tema">
      <picture class="cabecera__icono">
        <img src="/header/modo-oscuro.svg" alt="Modo oscuro" class="cabecera__icono">
      </picture>
    </button>
    <button class="cabecera__boton" aria-label="Perfil de usuario">
      <picture class="cabecera__icono">
        <img src="/header/perfil.svg" alt="Perfil" class="cabecera__icono">
      </picture>
    </button>
  </section>
</header>
