<header class="cabecera">
  <a routerLink="/" class="cabecera__logo" title="Ir a Inicio">
    <picture class="cabecera__logo-icono">
      <img src="header/logo.svg" alt="Cohabit" title="Ir a Inicio" class="cabecera__logo-icono">
    </picture>
  </a>

  <nav class="cabecera__nav" [class.cabecera__nav--open]="menuAbierto">
    <ul class="cabecera__menu">
      <li class="cabecera__menu-opcion">
        <a routerLink="/inicio" class="cabecera__menu-enlace" (click)="menuAbierto = false">INICIO</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/dashboard" class="cabecera__menu-enlace" (click)="menuAbierto = false">DASHBOARD</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/style-guide" class="cabecera__menu-enlace" (click)="menuAbierto = false">STYLE GUIDE</a>
      </li>
      <li class="cabecera__menu-opcion">
        <a routerLink="/dashboard" class="cabecera__menu-enlace" (click)="menuAbierto = false">MI GRUPO</a>
      </li>
    </ul>
  </nav>
  
  <section class="cabecera__utilidades">
    <button 
      class="cabecera__boton cabecera__hamburguesa" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir menú de navegación">
      <span class="cabecera__icono" [feather]="'menu'" [tipo]="'header'"></span>
    </button>
    <button class="cabecera__boton" aria-label="Cambiar tema" (click)="alternarTema()">
      <span class="cabecera__icono" [feather]="modoIcon" [tipo]="'header'" [title]="modoTitle"></span>
    </button>
    <button class="cabecera__boton" aria-label="Perfil de usuario">
      <span class="cabecera__icono" [feather]="'user'" [tipo]="'header'" title="Perfil" role="img" aria-label="Perfil"></span>
    </button>
  </section>
</header>
