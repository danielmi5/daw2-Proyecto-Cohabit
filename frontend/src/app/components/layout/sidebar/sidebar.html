<aside class="barra-lateral">
  <header class="barra-lateral__encabezado">
    <h2 class="barra-lateral__titulo">{{ nombreUsuario }}</h2>
    <figure class="barra-lateral__perfil">
      <img 
        [src]="imagenPerfil" 
        [alt]="nombreUsuario"
        class="barra-lateral__perfil-imagen"
      />
    </figure>
  </header>
  
  <nav class="barra-lateral__navegacion">
    <ul class="barra-lateral__menu">
      <li class="barra-lateral__menu-item">
        <a 
          routerLink="/dashboard" 
          routerLinkActive="barra-lateral__menu-enlace--activo"
          class="barra-lateral__menu-enlace"
        >
          <span class="barra-lateral__menu-icono" aria-hidden="true">
            <i class="icono-casa"></i>
          </span>
          <span class="barra-lateral__menu-texto">Dashboard</span>
        </a>
      </li>
      <li class="barra-lateral__menu-item">
        <a 
          routerLink="/configuracion" 
          routerLinkActive="barra-lateral__menu-enlace--activo"
          class="barra-lateral__menu-enlace"
        >
          <span class="barra-lateral__menu-icono" aria-hidden="true">
            <i class="icono-engranaje"></i>
          </span>
          <span class="barra-lateral__menu-texto">Dashboard</span>
        </a>
      </li>
      <li class="barra-lateral__menu-item">
        <a 
          routerLink="/usuarios" 
          routerLinkActive="barra-lateral__menu-enlace--activo"
          class="barra-lateral__menu-enlace"
        >
          <span class="barra-lateral__menu-icono" aria-hidden="true">
            <i class="icono-usuarios"></i>
          </span>
          <span class="barra-lateral__menu-texto">Dashboard</span>
        </a>
      </li>
      <li class="barra-lateral__menu-item">
        <a 
          routerLink="/seguridad" 
          routerLinkActive="barra-lateral__menu-enlace--activo"
          class="barra-lateral__menu-enlace"
        >
          <span class="barra-lateral__menu-icono" aria-hidden="true">
            <i class="icono-candado"></i>
          </span>
          <span class="barra-lateral__menu-texto">Dashboard</span>
        </a>
      </li>
    </ul>
  </nav>

  @if (mostrarOpcionesPerfil) {
    <footer class="barra-lateral__pie">
      <ul class="barra-lateral__menu barra-lateral__menu--secundario">
        <li class="barra-lateral__menu-item">
          <a 
            routerLink="/informacion" 
            routerLinkActive="barra-lateral__menu-enlace--activo"
            class="barra-lateral__menu-enlace"
          >
            <span class="barra-lateral__menu-icono" aria-hidden="true">
              <i class="icono-info"></i>
            </span>
            <span class="barra-lateral__menu-texto">Ayuda</span>
          </a>
        </li>
        <li class="barra-lateral__menu-item">
          <button 
            type="button"
            id = "btn-cerrar-sesion"
            class="barra-lateral__menu-enlace"
          >
            <span class="barra-lateral__menu-icono" aria-hidden="true">
              <i class="icono-salir"></i>
            </span>
            <span class="barra-lateral__menu-texto">Cerrar sesión</span>
          </button>
        </li>
      </ul>
    </footer>
  }
</aside>
