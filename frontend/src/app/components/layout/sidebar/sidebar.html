<!-- Sidebar único: renderiza según la propiedad `variante` -->
<aside class="barra-lateral">
  <header class="barra-lateral__encabezado">
    <h2 class="barra-lateral__titulo">{{ nombreUsuario() }}</h2>
    <figure class="barra-lateral__perfil">
      <app-tooltip [texto]="'Imagen de perfil de ' + nombreUsuario()">
        <img [src]="imagenPerfil()" [alt]="nombreUsuario() ? ('Foto de perfil de ' + nombreUsuario()) : 'Foto de perfil'" class="barra-lateral__perfil-imagen" />
      </app-tooltip>
    </figure>
  </header>

  <nav class="barra-lateral__navegacion">
    <ul class="barra-lateral__menu">
      @if (variante === 'dashboard') {
        <li class="barra-lateral__menu-item">
          <a routerLink="/dashboard" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'home'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Dashboard</span>
          </a>
        </li>
        <li class="barra-lateral__menu-item">
          <a routerLink="/dashboard/reservas" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'layers'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Reservas</span>
          </a>
        </li>
      } @else if (variante === 'grupo') {
        <li class="barra-lateral__menu-item">
          <a routerLink="/grupo" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'home'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Datos del grupo</span>
          </a>
        </li>
        <li class="barra-lateral__menu-item">
          <a routerLink="/grupo/recursos" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'layers'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Recursos</span>
          </a>
        </li>
        <li class="barra-lateral__menu-item">
          <a routerLink="/grupo/miembros" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'users'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Miembros</span>
          </a>
        </li>
      } @else if (variante === 'perfil') {
        <li class="barra-lateral__menu-item">
          <a routerLink="/perfil" routerLinkActive="barra-lateral__menu-enlace--activo" [routerLinkActiveOptions]="{ exact: true }" class="barra-lateral__menu-enlace">
            <span class="barra-lateral__menu-icono"><span [feather]="'home'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Datos personales</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  @if (mostrarOpcionesPerfil()) {
    <footer class="barra-lateral__pie">
      <ul class="barra-lateral__menu barra-lateral__menu--secundario">
        <li class="barra-lateral__menu-item">
          <button type="button" id="btn-cerrar-sesion" class="barra-lateral__menu-enlace" (click)="cerrarSesion()">
            <span class="barra-lateral__menu-icono"><span [feather]="'log-out'" [tipo]="'submenu'"></span></span>
            <span class="barra-lateral__menu-texto">Cerrar sesión</span>
          </button>
        </li>
      </ul>
    </footer>
  }
</aside>
