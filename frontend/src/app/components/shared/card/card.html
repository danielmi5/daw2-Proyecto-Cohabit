<article class="card" [class.card--horizontal]="variante === 'horizontal'">
  @if (imagen && variante === 'horizontal') {
    <figure class="card__figure">
      <img class="card__imagen" [src]="imagen" [alt]="imagenAlt || titulo" />
    </figure>
  }

  <div class="card__content">
    <header class="card__header">
      <h2 class="card__titulo">{{ titulo }}</h2>
      <small class="card__estado">{{ estado }}</small>
    </header>

    <section class="card__cuerpo">
      <ul class="card__detalles">
        <li class="card__detalle-item">
           <strong class="card__detalle-etiqueta">Fecha:</strong>
           <p class="card__detalle-valor">{{ fecha || 'Sin especificar' }}</p>
         </li>
        <li class="card__detalle-item">
          <strong class="card__detalle-etiqueta">Horarios:</strong>
          <p class="card__detalle-valor">{{ formatHora(hora) }}</p>
        </li>
        @if (autor) {
          <li class="card__detalle-item">
            <strong class="card__detalle-etiqueta">Autor:</strong>
            <p class="card__detalle-valor">{{ autor }}</p>
          </li>
        }
      </ul>
    </section>
  </div>

  @if (mostrarAcciones) {
    <aside class="card__acciones">
      <button 
        type="button" 
        class="card__boton card__boton--editar" 
        aria-label="Editar reserva"
        (click)="onEditar()">
        <span [feather]="'edit-2'" [tipo]="'botones'"></span>
      </button>
      <button 
        type="button" 
        class="card__boton card__boton--eliminar" 
        aria-label="Eliminar reserva"
        (click)="onEliminar()">
        <span [feather]="'trash-2'" [tipo]="'botones'"></span>
      </button>
    </aside>
  }
</article>
