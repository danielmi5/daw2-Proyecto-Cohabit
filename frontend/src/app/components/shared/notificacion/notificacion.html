<div class="toast-container">
  @for (notification of notificacionService.notificaciones(); track notification.id) {
    <div class="toast-wrapper" @notificacionAnim>
      <app-alert 
        [tipo]="notification.type"
        [cerrable]="true"
        (cerrar)="notificacionService.eliminar(notification.id)">
        {{ notification.message }}
      </app-alert>
    </div>
  }
</div>
