<div class="toast-container">
  @for (notificacion of notificacionService.notificaciones(); track notificacion.id) {
    <div class="toast-wrapper" @notificacionAnim>
      <app-alert 
        [tipo]="notificacion.type"
        [cerrable]="true"
        (cerrar)="notificacionService.eliminar(notificacion.id)">
        {{ notificacion.mensaje }}
      </app-alert>
    </div>
  }
</div>
