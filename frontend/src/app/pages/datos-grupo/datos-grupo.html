@if (cargando()) {
  <section class="datos-grupo__estado datos-grupo__estado--carga">
    <div class="datos-grupo__cargador"></div>
    <p>Cargando datos del grupo...</p>
  </section>
} @else {
  <section class="datos-grupo">
    <app-data-grupo 
      [grupo]="grupoActual()"
      [miembro]="miembroActual()"
      (actualizar)="actualizarGrupo($event)"
      (subirFoto)="subirFotoGrupo($event)"
      (eliminarFoto)="eliminarFotoGrupo()">
    </app-data-grupo>
  </section>
}
