@if (cargando()) {
  <section class="mi-grupo__estado mi-grupo__estado--carga">
    <div class="mi-grupo__cargador"></div>
    <p>Cargando...</p>
  </section>
} @else if (tieneGrupo()) {
  <div class="mi-grupo">
    <app-sidebar [variante]="'grupo'" />
    <section class="mi-grupo__contenido">
      <router-outlet></router-outlet>
    </section>
  </div>
} @else {
  <section class="mi-grupo__vacio">
    <div class="mi-grupo__vacio-contenido">
      <h2 class="mi-grupo__vacio-titulo">No perteneces a ningún grupo</h2>
      <p class="mi-grupo__vacio-texto">Crea un grupo para empezar a gestionar recursos compartidos</p>
      <app-button tipo="button" [variante]="'primario'" (click)="abrirModal()">Crear Grupo</app-button>
      <section class="mi-grupo__unirse">
        <p class="mi-grupo__vacio-texto">También puedes unirte a un grupo mediante su código de invitación.</p>
        <app-form-input id="codigoUnirse" placeholder="Código de invitación" #codigoInput></app-form-input>
        <app-button tipo="button" [variante]="'primario'" (click)="unirGrupo(codigoInput.valor)">Unirse</app-button>
      </section>
    </div>
  </section>
}

<app-modal-grupo
  [visible]="mostrarModal()"
  (cerrar)="cerrarModal()"
  (guardar)="crearGrupo($event)">
</app-modal-grupo>
