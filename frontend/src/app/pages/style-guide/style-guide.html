<section class="style-guide">
  <h1 class="style-guide__titulo">Guía de estilos</h1>

  <section class="style-guide__contenido">
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Input</h2>
      <app-form-input 
        id="input-base"
        name="nombre"
        etiqueta="Input base (solo label)" 
        placeholder="Placeholder"
      ></app-form-input>

      <app-form-input
        id="input-error"
        name="nombreError"
        etiqueta="Input con error"
        placeholder="Valor erróneo"
        [hayError]="true"
        mensajeError="El valor no es válido"
      ></app-form-input>

      <app-form-input
        id="input-exito"
        name="nombreExito"
        etiqueta="Input correcto"
        placeholder="El valor es correcto"
        [exito]="true"
      ></app-form-input>

      <app-form-input
        id="input-con-mensaje"
        name="nombreConMensaje"
        etiqueta="Input con mensaje"
        placeholder="Valor con mensaje"
        mensajeExito="Campo válido correctamente"
      ></app-form-input>

      <app-form-input
        id="input-desactivado"
        name="nombreDesactivado"
        etiqueta="Input desactivado"
        placeholder="No editable"
        [desactivado]="true"
      ></app-form-input>
    </section>
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Textarea</h2>
      <app-form-textarea
          id="textarea-base"
          name="mensajeBase"
          etiqueta="Textarea base"
          placeholder="Texto base"
        ></app-form-textarea>

        <app-form-textarea
          id="textarea-con-mensaje"
          name="mensajeConMensaje"
          etiqueta="Textarea con mensaje"
          placeholder="Texto con mensaje"
          mensajeExito="Mensaje de éxito personalizado"
        ></app-form-textarea>

        <app-form-textarea
          id="textarea-obligatorio"
          name="mensajeObligatorio"
          etiqueta="Textarea obligatorio"
          placeholder="Obligatorio"
          [requerido]="true"
        ></app-form-textarea>

        <app-form-textarea
          id="textarea-desactivado"
          name="mensajeDesactivado"
          etiqueta="Textarea desactivado"
          placeholder="No editable"
          [desactivado]="true"
        ></app-form-textarea>
    </section>
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Select</h2>
      <app-form-select
        id="select-base"
        name="selectBase"
        etiqueta="Select base"
        [opciones]="[{ value: '1', label: 'Opción 1' }, { value: '2', label: 'Opción 2' }, { value: '3', label: 'Opción 3' }]"
      ></app-form-select>

      <app-form-select
        id="select-obligatorio"
        name="selectObligatorio"
        etiqueta="Select obligatorio"
        [requerido]="true"
        [opciones]="[{ value: '1', label: 'Opción 1' }, { value: '2', label: 'Opción 2' }]"
      ></app-form-select>

      <app-form-select
        id="select-desactivado"
        name="selectDesactivado"
        etiqueta="Select desactivado"
        [desactivado]="true"
        [opciones]="[{ value: '1', label: 'Opción 1' }]"
      ></app-form-select>
    </section>
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Checkbox</h2>
      <app-form-checkbox
        id="checkbox-normal"
        name="checkboxNormal"
        etiqueta="Checkbox normal"
      ></app-form-checkbox>

      <app-form-checkbox
        id="checkbox-desactivado"
        name="checkboxDesactivado"
        etiqueta="Checkbox desactivado"
        [desactivado]="true"
      ></app-form-checkbox>
    </section>
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Sidebar</h2>
      <app-sidebar
      [mostrarOpcionesPerfil]="true">
      </app-sidebar>
    </section>
    <section class="style-guide__seccion">
      <h2 class="style-guide__titulos">Botón</h2>
      <div class="style-guide__botones">
        <section class="style-guide__grupo">
          <h3 class="style-guide__titulos">Primario</h3>
          <app-button variante="primario" tamanio="pequeno" [tieneIcono]="true">pequeño</app-button>
          <app-button variante="primario" tamanio="mediano">mediano</app-button>
          <app-button variante="primario" tamanio="grande">grande</app-button>
          <app-button variante="primario" [deshabilitado]="true">desactivado</app-button>
        </section>

        <section class="style-guide__grupo">
          <h3 class="style-guide__titulos">Secundario</h3>
          <app-button variante="secundario" tamanio="pequeno">pequeño</app-button>
          <app-button variante="secundario" tamanio="mediano" [tieneIcono]="true">mediano</app-button>
          <app-button variante="secundario" tamanio="grande">grande</app-button>
          <app-button variante="secundario" [deshabilitado]="true">desactivado</app-button>
        </section>

        <section class="style-guide__grupo">
          <h3 class="style-guide__titulos">Fantasma</h3>
          <app-button variante="fantasma" tamanio="pequeno">pequeño</app-button>
          <app-button variante="fantasma" tamanio="mediano">mediano</app-button>
          <app-button variante="fantasma" tamanio="grande" [tieneIcono]="true">grande</app-button>
          <app-button variante="fantasma" [deshabilitado]="true">desactivado</app-button>
        </section>

        <section class="style-guide__grupo">
          <h3 class="style-guide__titulos">Peligro</h3>
          <app-button variante="peligro" tamanio="pequeno">pequeño</app-button>
          <app-button variante="peligro" tamanio="mediano">mediano</app-button>
          <app-button variante="peligro" tamanio="grande">grande</app-button>
          <app-button variante="peligro" [deshabilitado]="true" [tieneIcono]="true">desactivado</app-button>
        </section>
      </div>
    </section>
  </section>
</section>
